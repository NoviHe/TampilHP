[package]
name = "tampilhp"
version = "0.1.0"
description = "Lightweight one-click Android screen mirroring & livestreaming launcher built on scrcpy"
authors = ["TampilHP"]
edition = "2021"

[lib]
name = "tampilhp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "net", "io-util", "macros", "rt-multi-thread"] }
mdns-sd = "0.13"
rand = "0.8"
